name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, no network / no KVM: bash syntax, shellcheck, unit + CLI tests.
  lint-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Static + unit + CLI tests
        run: ./tests/run.sh static unit cli

  # Build the Alpine rootfs (rootless, via fakeroot) and inspect it with
  # debugfs. Needs network (Alpine mirror) but not KVM.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y fakeroot e2fsprogs
      - name: Build + inspect rootfs
        run: ./tests/run.sh build

  # End-to-end: boot the microVM under KVM and assert it reaches a root shell
  # and powers off cleanly. GitHub-hosted Linux runners expose /dev/kvm.
  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y fakeroot e2fsprogs
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Boot smoke test
        run: ./tests/run.sh smoke
